/* Higher-contrast garden palette, with a weekly practice journal. */
:root{--ink:#193f35;--muted:#486354;--green:#176344;--lime:#d8f19f;--bg:#dce8df;--line:#bbccbc}

.tag{background:#dce8c7;color:#284c33}.visual-tag{background:#dcd2eb;color:#513d70}.secondary{border:1px solid #c4d2b7!important}button.secondary{background:#dce7ce;color:#234d37}.bar{background:#d9e0d0}.bar i{background:#39805c}

.weekly-calendar{padding:26px;background:#f0eedc;min-width:0}.weekly-calendar h2{font-size:22px;margin:5px 0 8px}.calendar-navigation{display:flex;gap:5px;align-items:center}.calendar-switch{margin:15px 0}.calendar-switch .tiny{color:#516344;flex:1;min-width:150px}.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}.calendar-day{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;padding:13px 3px;background:#d9e4cd;color:#294832;border:1px solid #b1c69f;border-radius:12px;min-height:159px;isolation:isolate}.calendar-day>*:not(.day-fill){z-index:1}.calendar-day .day-name{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px}.calendar-day .day-date{font-size:25px;font-weight:750}.calendar-day strong{font-size:12px;white-space:nowrap}.calendar-day .tiny{font-size:10px;font-weight:500}.day-fill{position:absolute;inset:0;z-index:0;display:flex;align-items:end;pointer-events:none}.day-fill i{display:block;width:100%;background:#aac98c77}.calendar-day.today{border:2px solid #386b4b;background:#e9efce}.calendar-day.today .day-name{color:#24543b}.calendar-day.selected{outline:3px solid #a47627;outline-offset:-3px}.calendar-day.day-guide-met{background:#b8d3a1}.calendar-day:hover{filter:brightness(.96);border-color:#557c45}.calendar-day.outside{opacity:.5}.calendar-grid.month .calendar-day{min-height:105px;padding:7px 2px;gap:2px}.calendar-grid.month .day-name{display:none}.calendar-grid.month .day-date{font-size:19px}.calendar-grid.month .calendar-day .tiny{display:none}.month-title{color:#31503b}.calendar-note{font-size:13px;color:#4a6145;margin:17px 0}.calendar-zone{color:#5a684c;margin-bottom:0}.day-details{border-radius:11px;margin-top:16px;background:#e1e5ca;border:1px solid #bfccaa;padding:13px 15px}.day-details strong,.day-details span{display:block}.day-details span,.day-details p{font-size:12px;margin:5px 0;color:#415637}

/* Shared semantic tokens: themes reach the entire app, including the weekly calendar.
   Mathematical diagrams deliberately retain a light canvas for reliable ink contrast. */
body{font-size:16px;background:radial-gradient(ellipse at top right,var(--glow),transparent 65%),var(--bg);background-attachment:fixed}
header{background:var(--head);border-color:var(--lime);gap:20px;flex-wrap:wrap}
.brand{color:var(--head-ink)}.brand span{background:var(--lime);color:var(--head)}
nav button{color:#fff;font-size:14px}nav button.active,nav button:hover{background:var(--lime);color:var(--head)}
header select{background:var(--surface);color:var(--ink);border-color:var(--line)}
.card,.practice .card,.card.skill,.card.skill:nth-child(3n+2),.card.skill:nth-child(3n){background:var(--surface);border-color:var(--line);color:var(--ink)}
.card.skill{border-top-color:var(--green)}.card.skill:nth-child(3n+2){border-top-color:var(--accent)}.card.skill:nth-child(3n){border-top-color:var(--green)}
.stats .card,.stats .card:nth-child(2),.stats .card:nth-child(3){background:var(--soft);border-color:var(--line)}
.hero{background:linear-gradient(115deg,var(--head),var(--head));border-color:var(--line);color:#fff;gap:24px}
.hero .muted,.hero .eyebrow{color:#fff}.hero button{background:var(--lime);color:var(--head)}.hero .tag{color:var(--head)}
button{background:var(--green);color:var(--button-ink)}button.secondary{background:var(--soft);color:var(--ink);border-color:var(--line)!important}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline-color:var(--accent)}
select,input{background:var(--surface);color:var(--ink);border-color:var(--line)}
.tag,.visual-tag,.icon{background:var(--soft);color:var(--ink)}.bar{background:var(--soft)}.bar i,.spark i{background:var(--green)}
.standard-code,.footer,details>summary{color:var(--muted)}
.notice{background:#fff2cc;color:#614615}.feedback{background:#e5f4dc;color:#173c2b}.feedback.wrong{background:#fff0d5;color:#563719}
.diagram,.visual,.visual-preview,.plot-inputs{background:#f8faf6;color:#213e34;border-color:#c3d2c2}.diagram .muted{color:#42604b}
.answer-option{background:var(--surface);color:var(--ink);border-color:var(--line)}.answer-option.selected{background:var(--soft);border-color:var(--green)}
.answer-option:has(svg){background:#f8faf6;color:#213e34}.choice-letter{background:#e8efdf;color:#213e34}
.point-target.selected{background:#176344}.point-target:hover,.point-target:focus-visible{background:#80b775aa;border-color:#326a4b}
.rhythm-section{border-color:var(--line)}.weekly-goal{background:var(--head);color:#fff}
.weekly-goal .eyebrow,.weekly-goal p,.weekly-percent,.goal-pill{color:#fff}.goal-track{background:#ffffff30}.goal-track i{background:var(--lime)}
.weekly-calendar{background:var(--surface)}.weekly-calendar h2,.month-title{color:var(--ink)}
.calendar-switch .tiny,.calendar-note,.calendar-zone{color:var(--muted)}
.calendar-day{background:var(--soft);color:var(--ink);border-color:var(--line)}.calendar-day.today{background:var(--soft-alt);border-color:var(--green)}.calendar-day.today .day-name{color:var(--ink)}
.calendar-day.day-guide-met{background:var(--soft-alt)}.calendar-day.selected{outline-color:var(--accent)}.day-fill i{background:var(--green);opacity:.12}
.day-details{background:var(--soft);border-color:var(--line)}.day-details p,.day-details span{color:var(--muted)}
.practice-clock{background:var(--head);color:#fff;border-color:var(--line)}.practice-clock .eyebrow,.clock-session #clockState{color:#fff}.practice-clock button{background:var(--lime);color:var(--head)}.live-track{background:#ffffff30}.live-track i{background:var(--lime)}
.trouble-panel{background:var(--surface)}.trouble-panel th{color:var(--ink)}.trouble-panel .tag{background:var(--soft)}
.card[style*="background"]{background:var(--surface)!important}
button.small,.skill p,.tiny,label,.answer-options legend,details>summary{font-size:14px}
.eyebrow,.standard-code,.tag,.collection-label{font-size:12px}.footer{font-size:14px}
#toast{background:var(--head);color:#fff;max-width:min(620px,calc(100vw - 32px));width:max-content;box-shadow:0 8px 30px #0003}
/* Original companion art, embedded in the HTML. */
.companion-image{object-fit:contain;display:block;width:100%;height:auto;aspect-ratio:1;border-radius:22px;background:#faf8ef}
.companion-hero{width:225px;flex:none;text-align:center;padding:10px;transform:rotate(2deg)}
.companion-hero .companion-image{box-shadow:0 12px 25px #0003;border:5px solid #ffffff30}
.companion-hero span{display:block;font-size:13px;line-height:1.5;margin-top:10px;color:#fff}
.reward-home{display:flex;gap:25px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:18px;padding:25px;margin-top:22px}
.reward-home h2{margin:8px 0}.reward-home p{color:var(--muted);margin:8px 0 15px}.reward-home>button{flex-shrink:0}
.reward-practice{display:flex;align-items:center;gap:17px;margin:18px 0;padding:15px 18px;background:var(--surface);border:1px solid var(--line);border-radius:18px}
#companionPortrait{flex:0 0 96px}.companion-words{flex:1;min-width:0}.companion-words strong{font-size:17px}.companion-words p{margin:5px 0;font-size:15px}
.daily-reward{min-width:180px;flex:1}.has-companion .daily-reward{flex:0 1 235px;border-left:1px solid var(--line);padding-left:16px}
.daily-reward>strong,.daily-reward>.eyebrow,.daily-reward>.tiny{display:block}.daily-reward>.tiny{color:var(--muted);line-height:1.4}
.reward-meter{height:7px;margin:8px 0;background:var(--soft);overflow:hidden;border-radius:8px}.reward-meter i{display:block;height:100%;background:var(--green);width:0}
.companion-cheer{animation:garden-cheer .85s ease both}
@keyframes garden-cheer{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-12px) rotate(-7deg)}55%{transform:translateY(-5px) rotate(7deg)}75%{transform:translateY(-9px) rotate(-3deg)}}
.reward-summary{margin-bottom:22px;padding-bottom:25px;border-bottom:1px solid var(--line)}.reward-summary .companion-image{width:145px;margin:0 auto 14px}.reward-summary p{max-width:560px;margin:15px auto}
/* The collection is a working wardrobe, not a shop. Every choice is visible. */
.collection-heading{display:flex;align-items:center;justify-content:space-between;gap:24px}.collection-heading h1{font-size:clamp(28px,3.3vw,42px)}.collection-heading p{color:var(--muted);margin:10px 0}
.collection-totals{display:grid;grid-template-columns:auto auto;gap:3px 12px;align-items:center;flex:none;border:1px solid var(--line);padding:14px 20px;border-radius:15px;background:var(--surface)}.collection-totals strong{font-size:24px}.collection-totals span{color:var(--muted);font-size:14px}
.collection-rule{padding:15px 18px;margin-top:22px;border-radius:12px;background:var(--soft);font-size:14px}
.collection-tabs{display:flex;gap:9px;flex-wrap:wrap;margin:25px 0 17px}.collection-tabs button{border-radius:30px;font-size:14px}.collection-tabs button.active{box-shadow:0 3px 0 var(--accent)}
.collection-intro{color:var(--muted);max-width:920px;line-height:1.65;margin-bottom:24px}.collection-footnote{margin:28px 0;color:var(--muted);font-size:14px;border-top:1px solid var(--line);padding-top:20px}
.theme-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.theme-card{border:1px solid var(--line);border-radius:19px;overflow:hidden;background:var(--surface)}
.theme-sample{position:relative;height:130px;background:var(--sample-bg);overflow:hidden;padding:28px}.theme-sample>span{position:absolute;top:0;left:0;right:0;height:24px;background:var(--sample-head)}
.theme-sample>i{display:block;position:absolute;top:42px;left:24px;bottom:20px;width:34%;background:var(--sample-head);border-radius:10px}
.theme-sample>b{position:absolute;left:35px;top:52px;color:var(--sample-accent);font-size:27px;font-weight:800;letter-spacing:-1px}
.theme-sample>em{position:absolute;top:42px;right:24px;bottom:20px;width:43%;background:linear-gradient(120deg,var(--sample-surface),var(--sample-alt));border:2px solid var(--sample-accent);border-radius:10px}
.theme-info{padding:19px 20px 21px}.collection-label{font-weight:650;color:var(--muted);display:block}.theme-info h3{font-size:19px;margin:5px 0}.theme-info p{font-size:14px;color:var(--muted);margin:7px 0 18px;min-height:22px}.theme-info button{flex:1}
.theme-card.owned{border-color:var(--green)}.theme-info button:disabled{opacity:1;background:var(--soft);color:var(--muted);border:1px solid var(--line);cursor:default}
.preview-banner{position:sticky;top:8px;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:15px;background:var(--head);color:#fff;border:2px solid var(--lime);padding:13px 18px;margin:18px 0;border-radius:15px;box-shadow:0 6px 20px #0003;font-size:14px}
.friendship-strip{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap;border:1px solid var(--line);background:var(--soft);border-radius:14px;padding:16px 20px;margin-bottom:22px;font-size:14px}.friendship-strip>span:first-child{font-weight:700}
.companion-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.companion-card{background:var(--surface);border:1px solid var(--line);border-radius:23px;overflow:hidden}.companion-card.selected{border:2px solid var(--green)}
.companion-art{position:relative;padding:16px 16px 0}.companion-art .companion-image{max-width:290px;margin:auto}.companion-symbol{position:absolute;right:24px;bottom:12px;background:var(--head);color:var(--lime);width:38px;height:38px;display:grid;place-items:center;border-radius:50%;font-size:23px}
.companion-card .theme-info{text-align:center}.companion-card h2{margin:6px 0;font-size:25px}.companion-card p{min-height:44px}.companion-card button{font-size:14px;width:100%}
.collection-settings label{display:flex;gap:12px;align-items:center;padding:10px 0;font-size:16px}.collection-settings input{width:20px;height:20px;margin:0;accent-color:var(--green)}
.badge-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.badge-card{display:flex;gap:15px;padding:21px;border:1px dashed var(--line);border-radius:16px;background:var(--surface)}.badge-card>span{font-size:36px;line-height:1.5}.badge-card.earned{border-style:solid;border-color:var(--green);background:var(--soft)}.badge-card h3{margin:5px 0}.badge-card p{font-size:14px;color:var(--muted);margin:8px 0 0}
.journal-head{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin:26px 0}.journal-head h2{margin:8px 0}.journal-head p{color:var(--muted)}
.stamp-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.garden-stamp{text-align:center;border:1px dashed var(--line);border-radius:18px;background:var(--surface);padding:24px 10px;display:flex;flex-direction:column;gap:8px}.garden-stamp>span{font-size:42px}.garden-stamp strong{font-size:14px}.garden-stamp small{font-size:14px;color:var(--muted)}.garden-stamp.earned{border:2px solid var(--green);background:var(--soft-alt)}

function svgWrap(body,label,w=560,h=280){return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(label)}"><title>${esc(label)}</title>${body}</svg>`}
function svgText(x,y,t,size=15,color='#294c43'){return `<text x="${x}" y="${y}" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="${size}" fill="${color}">${esc(t)}</text>`}
function svgLine(x,y,x2,y2,color='#b8c9c0',width=1){return `<line x1="${x}" y1="${y}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${width}"/>`}
function polygon(points,color){return `<polygon points="${points.map(p=>p.join(',')).join(' ')}" fill="${color}" stroke="#365749" stroke-width="1.5"/>`}
function coordinateGrid(){let out='';for(let n=-6;n<=6;n++){let p=180+n*23;out+=svgLine(p,42,p,318)+svgLine(42,p,318,p);if(n&&n%2===0)out+=svgText(p,198,n,11)+svgText(165,180-n*23+4,n,11)}return out+svgLine(35,180,330,180,'#647c71',2)+svgLine(180,330,180,30,'#647c71',2)+svgText(340,183,'x')+svgText(181,22,'y')}
function graphPoint(x,y){return [180+x*23,180-y*23]}

function visualQuestion(id,l){let q='',answer=0,hint='',explain='',unit='',body='',visual='',options=null,evidence={};
if(id==='fractionModel'){
 const cols=rnd(2,l+3),rows=rnd(2,l+4),n=rnd(1,cols-1),m=rnd(1,rows-1),x=155,y=25,size=210;

 body+=svgText(260,261,'Dark cells show the overlap',14);q=`The model shows ${n}/${cols} × ${m}/${rows}. What fraction of the whole is in the dark overlap?`;answer=n*m/(cols*rows);hint='Count the dark cells, then count all equal cells in the whole.';explain=`${n*m} overlapping cells out of ${cols*rows} equal cells: ${n}/${cols} × ${m}/${rows} = ${n*m}/${cols*rows}.`;evidence={cols,rows,n,m};visual=svgWrap(body,`A ${cols}-column, ${rows}-row grid. ${n} columns and ${m} rows are shaded; their overlap has cross marks.`);
}else if(id==='linePlot'||id==='dotPlot'){
 const fraction=id==='linePlot',den=fraction?(l===1?2:4):1,base=fraction?rnd(1,3):0,counts=Array.from({length:5},()=>rnd(1,3+l)),target=rnd(0,4),values=counts.map((_,i)=>base+i/den);
 body=svgText(280,23,fraction?'Lengths of ribbon (metres)':'Books read this month',18)+svgLine(50,212,510,212,'#647c71',2);
 counts.forEach((n,i)=>{let x=80+i*100;body+=svgLine(x,207,x,218,'#647c71',2)+svgText(x,240,fmtFraction(base*den+i,den));for(let j=0;j<n;j++)body+=svgText(x,195-j*23,'×',23,'#28745a')});body+=svgText(280,272,'Each × represents one '+(fraction?'piece of ribbon':'reader'),13);
 if(fraction){let total=values.reduce((sum,v,i)=>sum+v*counts[i],0);answer=l===3?Math.ceil(total)+rnd(2,5)-total:total;let roll=l===3?total+answer:null;q=l===3?`A roll held ${roll} metres. These pieces were cut from it. How many metres are left?`:'What is the total length of all the pieces of ribbon?';hint='Multiply each length by the number of crosses above it, then add.';explain=values.map((v,i)=>`${counts[i]} × ${fmtFraction(base*den+i,den)}`).join(' + ')+` = ${fmtFraction(Math.round(total*den),den)} m.`+(roll?` Subtract from ${roll} m: ${fmtFraction(Math.round(answer*den),den)} m remain.`:'');unit='metres';evidence={counts,values,roll};}
 else {answer=l===1?counts[target]:counts.slice(target).reduce((a,b)=>a+b,0);q=l===1?`How many readers read exactly ${target} books?`:`How many readers read at least ${target} books?`;hint='Each cross stands for one reader. '+(l>1?'Include the selected value and every value to its right.':'Count the crosses above that value.');explain=l===1?`There are ${answer} crosses above ${target}, so ${answer} readers.`:`Add the counts for ${target} through 4 books: ${counts.slice(target).join(' + ')} = ${answer}.`;unit='readers';evidence={counts,target};}

 body=svgText(280,28,'Seedling height (cm)',18)+svgLine(55,175,520,175,'#647c71',2);for(let n=0;n<=max+5;n+=5)body+=svgLine(px(n),169,px(n),181)+svgText(px(n),202,n,12);

 // One cube deep: every column is visible and no hidden depth is ambiguous.

 const a=rnd(2,4),b=a+rnd(1,3),k=rnd(2,l+2),same=!!rnd(0,1),c=a*k,d=b*k+(same?0:1),draw=(x,y,w,h,label1,label2)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#edf0da" stroke="#65815b" stroke-width="2"/>`+svgText(x+w/2,y+h+24,label1+' cm')+svgText(x+w+32,y+h/2,label2+' cm');body=draw(60,60,b*17,a*17,b,a)+draw(305,45,d*Math.min(7,150/d),c*Math.min(7,150/d),d,c);q='Are these rectangles similar? Use the labelled side lengths.';answer=same?0:1;options=[{label:'Yes'},{label:'No'}];hint='Compare the scale factor for each pair of corresponding sides.';explain=same?`Both dimensions scale by ${k}: ${a} × ${k} = ${c}, and ${b} × ${k} = ${d}.`:`${a} → ${c} scales by ${k}, but ${b} × ${k} = ${b*k}, not ${d}. The ratios differ.`;evidence={a,b,c,d};visual=svgWrap(body,`Rectangle one is ${b} by ${a} cm. Rectangle two is ${d} by ${c} cm.`,560,290);

function answerControls(q){if(q.options)return `<fieldset class="answer-options"><legend>Choose one answer</legend>${q.options.map((o,i)=>`<button type="button" class="answer-option" data-choice="${i}"><span class="choice-letter">${String.fromCharCode(65+i)}</span>${o.visual||''}<span>${esc(o.label)}</span></button>`).join('')}</fieldset>`;return `<form id="answerForm" class="row section"><label><span class="tiny">Your answer ${q.unit?'('+q.unit+')':''}</span><input id="answer" autocomplete="off" inputmode="text" required aria-label="Your answer"></label><button>Check answer →</button></form><p class="tiny muted">Use a number, decimal, fraction (3/4), or mixed number (2 1/4).</p>`}

case 'compound':{let target=rnd(4,10),count=0;for(let i=1;i<=6;i++)for(let j=1;j<=6;j++)if(i+j===target)count++;q=C.num(`Two fair six-sided dice are rolled independently. What is the probability their sum is ${target}?`,count/36,`There are 36 equally likely ordered pairs. ${count} pairs sum to ${target}, giving ${C.frac(count,36)}.`,'Pairs (1, 3) and (3, 1) are different ordered outcomes.',{facts:{target,count}});break}

 if(!c.rewards)c.rewards={version:1,themes:['garden'],theme:'garden',companions:[],companion:null,motion:true,showCompanion:true,seenDays:[],seenWeeks:[]};
 return c.rewards;
}
function rewardsValidate(d){
 for(const c of d.children){const r=rewardsEnsure(c),f=rewardFacts(c);
  if(!r||r.version!==1||!Array.isArray(r.themes)||r.themes.length>GARDEN_THEMES.length||!Array.isArray(r.companions)||r.companions.length>GARDEN_COMPANIONS.length||typeof r.motion!=='boolean'||typeof r.showCompanion!=='boolean')throw Error('Invalid collection settings');
  const ids=(items,allowed)=>items.every(id=>typeof id==='string'&&allowed.some(x=>x.id===id))&&new Set(items).size===items.length;
  if(!ids(r.themes,GARDEN_THEMES)||!r.themes.includes('garden')||!ids(r.companions,GARDEN_COMPANIONS)||r.themes.length>f.days+1||r.companions.length>f.weeks||!r.themes.includes(r.theme)||(r.companion!==null&&!r.companions.includes(r.companion)))throw Error('Collection choices do not match earned rewards');
  for(const key of ['seenDays','seenWeeks']){if(!Array.isArray(r[key])||r[key].length>200000||!r[key].every(validDay))throw Error('Invalid collection journal');r[key]=[...new Set(r[key])];}
 }
 return d;
}
function rewardsSyncAll(announce=false){
 for(const c of data.children){const r=rewardsEnsure(c),f=rewardFacts(c),newDays=f.dayKeys.filter(k=>!r.seenDays.includes(k)),newWeeks=f.weekKeys.filter(k=>!r.seenWeeks.includes(k));
  r.seenDays=[...new Set([...r.seenDays,...f.dayKeys])];r.seenWeeks=[...new Set([...r.seenWeeks,...f.weekKeys])];
  if(announce&&c.id===data.selected&&(newDays.length||newWeeks.length)){
   const message=newWeeks.length?'Weekly goal complete! Your collection has a new companion choice or friendship star.':r.themes.length<GARDEN_THEMES.length?'15 minutes complete! A new colour scheme is yours to choose. A good moment for a break.':'15 minutes complete! A new garden stamp is yours. A good moment for a break.';
   rewardsLastAnnouncement=message;toast(message);
   const status=$('#rewardLive');if(status){status.textContent=message;status.setAttribute('role','status')}
  }
 }
}
function themeTokens(t){
 const h=t.hue,a=t.accent,d=t.dark;
 return {'--ink':`hsl(${h} 35% ${d?94:16}%)`,'--muted':`hsl(${h} 20% ${d?78:34}%)`,'--green':`hsl(${h} 65% ${d?76:30}%)`,'--lime':`hsl(${a} 80% 82%)`,'--bg':`hsl(${h} 55% ${d?10:94}%)`,'--line':`hsl(${h} 25% ${d?34:78}%)`,'--surface':`hsl(${h} 32% ${d?16:99}%)`,'--soft':`hsl(${h} 45% ${d?22:90}%)`,'--soft-alt':`hsl(${a} 45% ${d?22:91}%)`,'--head':`hsl(${h} 50% 17%)`,'--head-ink':'#ffffff','--button-ink':d?'#13212c':'#ffffff','--accent':`hsl(${a} 85% ${d?77:34}%)`,'--glow':`hsl(${a} 65% ${d?19:87}%)`};
}
function rewardsApplyTheme(){
 const r=rewardsEnsure(child()),t=GARDEN_THEMES.find(t=>t.id===(rewardsPreview||r.theme))||GARDEN_THEMES[0],root=document.documentElement;
 if(!root)return;for(const [k,v] of Object.entries(themeTokens(t)))root.style.setProperty(k,v);
 root.setAttribute('data-garden-theme',t.id);root.setAttribute('data-garden-motion',r.motion?'on':'off');
}
function rewardsPrepare(){
 rewardsEnsure(child());
 if(rewardsOwner!==child().id+':'+localDay()){rewardsOwner=child().id+':'+localDay();rewardsPreview=null;rewardsLastAnnouncement='';rewardsJournalPage=0;}
 if(page!=='rewards')rewardsPreview=null;
 rewardsApplyTheme();
}

 speech.textContent=lines[(c.attempts.length-1)%lines.length];const portrait=$('#companionPortrait');if(portrait&&r.motion){portrait.classList.remove('companion-cheer');if(correct){void portrait.offsetWidth;portrait.classList.add('companion-cheer')}}

 const f=rewardFacts(c),a=c.attempts,skillIds=new Set(a.map(x=>x.skill)),strandSet=new Set(a.map(x=>skills.find(s=>s.id===x.skill)?.strand)),history=new Map();let comeback=false,review=false;
 for(const x of a){const prev=history.get(x.skill);if(prev&&x.correct&&!prev.correct)comeback=true;if(prev&&x.at-prev.at>=3*86400000)review=true;history.set(x.skill,x)}
 return [
 ['🌱','First seed','Answer your first question.',a.length>=1],['💡','Helpful hint','Solve a question with a hint. Help is a strategy.',a.some(x=>x.correct&&x.hint)],['🧩','Another way','Solve a skill after an earlier mistake in it.',comeback],['🧭','Curious explorer','Try five different skills.',skillIds.size>=5],['🌈','All-round thinker','Explore all five maths strands.',strandSet.size>=5],['🔄','Welcome back','Revisit a skill after at least three days.',review],['📖','Question journal','Explore 100 questions, mistakes included.',a.length>=100],['🌼','Seven little days','Earn seven daily stamps, at any pace.',f.days>=7],['✨','First full week','Complete one 105-minute week.',f.weeks>=1],['🌳','Deep roots','Earn 30 daily stamps. No streak required.',f.days>=30],['🔭','Wide horizons','Try 20 different skills.',skillIds.size>=20],['🏵️','A season of growth','Earn 90 daily stamps, with breaks whenever needed.',f.days>=90]
 ].map(([icon,name,description,earned])=>({icon,name,description,earned}));
}

function rewardsJournal(){const f=rewardFacts(child()),total=Math.max(1,Math.ceil(f.days/7)),selected=Math.max(0,Math.min(total-1,rewardsJournalPage)),chapter=GARDEN_CHAPTERS[selected%GARDEN_CHAPTERS.length],keys=f.dayKeys.slice(selected*7,selected*7+7);return `<div class="journal-head"><div><span class="eyebrow">YOUR GROWING JOURNAL</span><h2>${chapter[0]} ${chapter[1]}</h2><p>Chapter ${selected+1} · ${keys.length} / 7 stamps</p></div><div class="row"><button class="secondary small" data-reward-journal="${selected-1}" ${selected===0?'disabled':''}>← Previous</button><button class="secondary small" data-reward-journal="${selected+1}" ${selected>=total-1?'disabled':''}>Next →</button></div></div><div class="stamp-grid">${Array.from({length:7},(_,i)=>`<div class="garden-stamp ${keys[i]?'earned':''}"><span aria-hidden="true">${keys[i]?chapter[0]:'○'}</span><strong>${keys[i]?dateLabel(keys[i],{month:'short',day:'numeric',year:'numeric'}):'A future little day'}</strong><small>${keys[i]?'15 minutes of growing':'No deadline'}</small></div>`).join('')}</div><p class="collection-intro">Every day with 15 minutes adds one dated stamp. Seven stamps fill a chapter, even if they take several weeks. New chapters keep growing after you collect every theme and companion.</p><div class="card"><span class="eyebrow">A LITTLE CURIOSITY, IF YOU FEEL LIKE IT</span><h3>${['Show someone a different way to solve one question.','Find a fraction somewhere in your day.','Sketch an idea that was hard to put into words.','Teach one tiny maths idea to someone else.','Notice a pattern outside the app.','Tell someone about a mistake that helped you learn.','Make up a question of your own.'][dayDate(localDay()).getDay()]}</h3><p class="muted">An optional off-screen idea. No timer, no points, no need to report back.</p></div>`}

function rewardsEvents(e){const b=e.target.closest('button');if(!b)return;const r=rewardsEnsure(child()),f=rewardFacts(child());
 if(b.dataset.rewardTab){rewardsTab=b.dataset.rewardTab;render()}
 if(b.dataset.rewardPreview&&GARDEN_THEMES.some(t=>t.id===b.dataset.rewardPreview)){rewardsPreview=b.dataset.rewardPreview;render()}
 if(b.dataset.rewardEndPreview){rewardsPreview=null;render()}
 if(b.dataset.rewardTheme){const id=b.dataset.rewardTheme;if(!GARDEN_THEMES.some(t=>t.id===id))return;if(!r.themes.includes(id)){if(r.themes.length-1>=f.days)return;r.themes.push(id)}r.theme=id;rewardsPreview=null;save();render();toast('Your colour is ready. Make yourself at home.')}
 if(b.dataset.rewardCompanion){const id=b.dataset.rewardCompanion;if(!GARDEN_COMPANIONS.some(p=>p.id===id))return;if(!r.companions.includes(id)){if(r.companions.length>=f.weeks)return;r.companions.push(id)}r.companion=id;r.showCompanion=true;save();render();toast(GARDEN_COMPANIONS.find(p=>p.id===id).name+' is ready to cheer you on.')}
 if(b.dataset.rewardJournal!==undefined){const n=Number(b.dataset.rewardJournal);if(Number.isInteger(n)){rewardsJournalPage=Math.max(0,Math.min(Math.max(0,Math.ceil(f.days/7)-1),n));render()}}
}

  const ids=new Set();for(const a of c.activity){if(ids.has(a.id))a.id='merged-'+recordHash(a.id+'|'+a.sessionId+'|'+a.startAt);ids.add(a.id)}
  c.rewards={version:1,themes:['garden'],companions:[],theme:'garden',companion:null,motion:true,showCompanion:true,seenDays:[],seenWeeks:[]};
  for(const r of records.filter(r=>r.kind==='field')){if(['name','grade','stage','sessionSize','assignments'].includes(r.key))c[r.key]=cloneCloud(r.value);else c.rewards[r.key]=cloneCloud(r.value)}
  const facts=rewardFacts(c),claims=records.filter(r=>r.kind==='unlock').sort((a,b)=>a.clock-b.clock||a.key.localeCompare(b.key));
  c.rewards.themes=['garden',...new Set(claims.filter(r=>r.value.type==='theme'&&r.value.id!=='garden').map(r=>r.value.id))].slice(0,facts.days+1);
  c.rewards.companions=[...new Set(claims.filter(r=>r.value.type==='companion').map(r=>r.value.id))].slice(0,facts.weeks);
  if(!c.rewards.themes.includes(c.rewards.theme))c.rewards.theme=c.rewards.themes.at(-1);
  if(!c.rewards.companions.includes(c.rewards.companion))c.rewards.companion=c.rewards.companions[0]||null;
  c.rewards.seenDays=facts.dayKeys;c.rewards.seenWeeks=facts.weekKeys;c.stage=c.grade===7?'MYP':'PYP';
 }
 data=validate(next);
 // Record projected fields before the next save, so downloads never become new edits.
 for(const c of data.children){const r=c.rewards;for(const [key,value] of Object.entries({name:c.name,grade:c.grade,stage:c.stage,sessionSize:c.sessionSize,assignments:c.assignments,theme:r.theme,companion:r.companion,motion:r.motion,showCompanion:r.showCompanion}))cloud.observed.set(c.id+'_field_'+key,JSON.stringify(value))}
 try{localStorage.setItem(KEY,JSON.stringify(data));storageOK=true}catch(e){storageOK=false}
 if(page!=='practice')render();else{rewardsApplyTheme();rhythmUpdateLabels()}
}
function cloudChanged(){if(!cloud.ready)return;cloudCapture();if(cloud.user){cloud.message=navigator.onLine?'Changes waiting to sync…':'Offline · saved on this device';cloudUI();clearTimeout(cloud.timer);cloud.timer=setTimeout(cloudSync,1800)}}
function cloudUI(){const label=document.getElementById('cloudStatus');if(label)label.textContent=cloud.message;const btn=document.getElementById('cloudOpen');if(btn)btn.textContent=cloud.user?'Cloud account':'Sign in & sync';const summary=document.getElementById('cloudAccount');if(summary)summary.textContent=cloud.user?'Signed in to your family account. Both children have separate progress.':'Sign in once on each family device. Existing progress will be merged into your family account.';const form=document.getElementById('cloudLogin');if(form)form.hidden=!!cloud.user;const out=document.getElementById('cloudLogout');if(out)out.hidden=!cloud.user}
function cloudError(e){const code=e.code||'';if(code.includes('permission-denied'))return 'Cloud access denied · publish the supplied Firestore rules, then Retry';if(code.includes('invalid-credential')||code.includes('wrong-password')||code.includes('user-not-found'))return 'Email or password is incorrect.';if(code.includes('too-many-requests'))return 'Too many sign-in attempts. Please try again later.';if(code.includes('operation-not-allowed'))return 'Enable Email/Password in Firebase Authentication.';if(code.includes('unauthorized-domain'))return 'Add wojogi.github.io in Authentication → Settings → Authorized domains.';if(code.includes('unavailable')||code.includes('network')||!navigator.onLine)return 'Offline · saved on this device, waiting to reconnect';return 'Cloud unavailable · progress remains on this device. Retry when connected.'}
async function cloudLoadSDK(){
 if(cloud.sdk)return cloud.sdk;
 const base='https://www.gstatic.com/firebasejs/12.18.0/';
 const [appSDK,authSDK,fsSDK]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);
 const app=appSDK.initializeApp(FIREBASE_CONFIG);cloud.sdk={...authSDK,...fsSDK};cloud.auth=authSDK.getAuth(app);cloud.db=fsSDK.getFirestore(app);
 await authSDK.setPersistence(cloud.auth,authSDK.browserLocalPersistence);
 authSDK.onAuthStateChanged(cloud.auth,async user=>{cloud.user=user&&user.uid===FAMILY_UID?user:null;cloud.cursor=null;cloud.known.clear();if(user&&!cloud.user){await authSDK.signOut(cloud.auth);cloud.message='Please sign in with the configured family account.'}else{cloud.message=cloud.user?'Connecting to your saved progress…':'Saved on this device · sign in for cloud backup'}cloudUI();if(cloud.user)cloudSync()});
 return cloud.sdk;
}
let cloudSDKPromise=null;
function cloudSDK(){if(!cloudSDKPromise)cloudSDKPromise=cloudLoadSDK().catch(e=>{cloudSDKPromise=null;throw e});return cloudSDKPromise}
async function cloudSync(){
 if(cloud.busy||!cloud.user||cloud.blocked)return;
 if(!navigator.onLine){cloud.message='Offline · saved on this device, waiting to reconnect';cloudUI();return}
 cloud.busy=true;cloud.message='Syncing family progress…';cloudUI();
 try{
  cloudCapture();const sdk=cloud.sdk,col=sdk.collection(cloud.db,'families',FAMILY_UID,'records');
  const query=cloud.cursor?sdk.query(col,sdk.where('updatedAt','>=',cloud.cursor)):col;
  const snapshot=await sdk.getDocsFromServer(query);
  // Capture again: an answer may have been added while the download was in flight.
  cloudCapture();
  for(const doc of snapshot.docs){const raw=doc.data(),r=JSON.parse(raw.payload);if(recordKey(r)!==doc.id)throw Error('Invalid cloud record');cloud.known.set(doc.id,recordVersion(r));cloudPut(r);if(raw.updatedAt&&(!cloud.cursor||raw.updatedAt.seconds>cloud.cursor.seconds||raw.updatedAt.seconds===cloud.cursor.seconds&&raw.updatedAt.nanoseconds>cloud.cursor.nanoseconds))cloud.cursor=raw.updatedAt}
  cloudProject();cloudPersist();
  const pending=Object.entries(cloud.records).filter(([key,r])=>cloud.known.get(key)!==recordVersion(r));
  for(let i=0;i<pending.length;i+=80){
   const chunk=pending.slice(i,i+80).map(([key])=>[key,cloneCloud(cloud.records[key])]);
   const committed=await sdk.runTransaction(cloud.db,async tx=>{
    const docs=await Promise.all(chunk.map(([key])=>tx.get(sdk.doc(col,key))));const result=[];
    for(let j=0;j<chunk.length;j++){const [key,local]=chunk[j],remote=docs[j].exists()?JSON.parse(docs[j].data().payload):null,merged=mergeRecord(remote,local);if(!remote||recordVersion(remote)!==recordVersion(merged))tx.set(sdk.doc(col,key),{payload:JSON.stringify(merged),updatedAt:sdk.serverTimestamp()});result.push([key,merged])}return result;
   });
   for(const [key,r] of committed){cloud.known.set(key,recordVersion(r));cloudPut(r)}
  }
  cloudCapture();cloudProject();cloudPersist();
  const remaining=Object.entries(cloud.records).some(([key,r])=>cloud.known.get(key)!==recordVersion(r));
  cloud.lastSaved=Date.now();cloud.message=remaining?'New changes waiting to sync…':'Saved online · '+new Date(cloud.lastSaved).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  if(remaining){clearTimeout(cloud.timer);cloud.timer=setTimeout(cloudSync,1800)}
 }catch(e){cloud.message=cloudError(e);console.warn('Math Garden sync:',e.code||e.message)}finally{cloud.busy=false;cloudUI()}
}
function cloudMount(){
 const style=document.createElement('style');style.textContent='#cloudBar{max-width:1180px;margin:12px auto 0;padding:10px 20px;display:flex;gap:12px;align-items:center;justify-content:space-between;color:var(--ink);font-size:14px;flex-wrap:wrap}#cloudBar .row{gap:8px}#cloudDialog{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:20px;max-width:480px;width:calc(100% - 32px);padding:26px}#cloudDialog::backdrop{background:#102a245e}#cloudDialog input{display:block;width:100%;box-sizing:border-box;margin:8px 0 16px;padding:12px;font:inherit}#cloudDialog p{line-height:1.5}#cloudDialog [hidden]{display:none!important}';document.head.append(style);
 const bar=document.createElement('section');bar.id='cloudBar';bar.setAttribute('aria-label','Cloud saving');bar.innerHTML='<span id="cloudStatus" role="status" aria-live="polite"></span><div class="row"><button id="cloudRetry" class="small secondary">Sync now</button><button id="cloudOpen" class="small secondary">Sign in &amp; sync</button></div>';document.querySelector('header').after(bar);
 const dialog=document.createElement('dialog');dialog.id='cloudDialog';dialog.innerHTML='<div class="row spread"><h2>Family cloud saving</h2><button id="cloudClose" class="small secondary" aria-label="Close cloud account">Close</button></div><p id="cloudAccount"></p><form id="cloudLogin"><label for="cloudEmail">Family email</label><input id="cloudEmail" type="email" autocomplete="username" required><label for="cloudPassword">Math Garden password</label><input id="cloudPassword" type="password" autocomplete="current-password" required minlength="6"><button id="cloudSubmit" type="submit">Sign in &amp; merge progress</button></form><p id="cloudLoginMessage" role="status"></p><button id="cloudLogout" class="secondary" hidden>Sign out</button><p class="tiny muted">Your password goes directly to Firebase Authentication. Local progress stays on this device after signing out. Use this on family devices. Parent → Export JSON keeps an extra backup.</p>';document.body.append(dialog);
 document.getElementById('cloudOpen').onclick=()=>{rhythmFlush();dialog.showModal();document.getElementById(cloud.user?'cloudClose':'cloudEmail').focus()};document.getElementById('cloudClose').onclick=()=>dialog.close();
 document.getElementById('cloudRetry').onclick=async()=>{try{await cloudSDK();if(cloud.user)cloudSync();else dialog.showModal()}catch(e){cloud.message=cloudError(e);cloudUI()}};
 document.getElementById('cloudLogin').onsubmit=async e=>{e.preventDefault();const msg=document.getElementById('cloudLoginMessage'),button=document.getElementById('cloudSubmit');button.disabled=true;msg.textContent='Signing in…';try{const sdk=await cloudSDK();const result=await sdk.signInWithEmailAndPassword(cloud.auth,document.getElementById('cloudEmail').value.trim(),document.getElementById('cloudPassword').value);document.getElementById('cloudPassword').value='';if(result.user.uid!==FAMILY_UID)throw Error('Wrong family');msg.textContent='Signed in. Check the save status above before closing this tab.';cloudUI()}catch(e){msg.textContent=e.message==='Wrong family'?'Please use your configured family account.':cloudError(e)}finally{button.disabled=false}};
 document.getElementById('cloudLogout').onclick=async()=>{rhythmStop();if(cloud.busy){document.getElementById('cloudLoginMessage').textContent='Please wait for the current sync to finish.';return}await cloud.sdk.signOut(cloud.auth);document.getElementById('cloudLoginMessage').textContent='Signed out. Local progress is still on this device.'};
}
function cloudInit(){
 cloudMount();
 if(!storageOK){cloud.blocked=true;cloud.message='Browser storage needs attention · cloud sync is paused to protect existing progress';cloudUI();return}
 try{const saved=localStorage.getItem(CLOUD_KEY);if(saved){const parsed=JSON.parse(saved);if(!parsed.records||typeof parsed.records!=='object')throw Error('Invalid sync cache');cloud.records=parsed.records}cloudCapture(true);cloudProject();cloud.ready=true;cloudPersist()}catch(e){cloud.blocked=true;cloud.message='Cloud setup paused · export your local progress before retrying';console.warn(e)}
 cloudUI();
 // Only sign-in credentials/tokens managed by Firebase Auth are persisted, never the password.
 cloudSDK().catch(e=>{cloud.message=cloudError(e);cloudUI()});
 setInterval(()=>{if(document.visibilityState==='visible')cloudSync()},30000);
 window.addEventListener('online',()=>cloudSDK().then(()=>cloudSync()).catch(e=>{cloud.message=cloudError(e);cloudUI()}));
 window.addEventListener('offline',()=>{cloud.message='Offline · saved on this device';cloudUI()});
 window.addEventListener('pagehide',()=>{rhythmFlush();cloudCapture()});
 // A second local tab must not erase an answer made in this tab.
 window.addEventListener('storage',e=>{if(e.key!==CLOUD_KEY||!e.newValue)return;try{cloudCapture(false,false);const incoming=JSON.parse(e.newValue);for(const r of Object.values(incoming.records))cloudPut(r);cloudProject();cloudUI()}catch(err){cloud.message='Local tab sync needs attention · export a backup';cloudUI()}});
}
cloudInit();
